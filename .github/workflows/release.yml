name: Desktop release preview

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - name: Match package version to tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm run check

  android-driver:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
      - run: ./gradlew --no-daemon test assembleRelease
        working-directory: android-driver
      - run: node android-driver/bundle.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: taprig-android-driver
          path: android-driver/build/bundle
          if-no-files-found: error

  build:
    needs: [verify, android-driver]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: linux
            targets: AppImage deb
            files: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            platform: windows
            command: win
            targets: nsis zip
            files: |
              release/*.exe
              release/*.zip
          - os: macos-15-intel
            platform: macos
            command: mac
            targets: dmg zip
            files: |
              release/*.dmg
              release/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - uses: actions/download-artifact@v8
        with:
          name: taprig-android-driver
          path: android-driver/build/bundle
      - name: Build unsigned preview
        run: npx electron-builder --${{ matrix.command }} ${{ matrix.targets }} --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: taprig-${{ matrix.platform }}-x64-unsigned
          path: ${{ matrix.files }}
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: taprig-*-unsigned
          path: release-assets
          merge-multiple: true
      - name: Validate and checksum assets
        run: |
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 6
          test "$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort -u | wc -l)" -eq 6
          (cd release-assets && sha256sum * | sort -k2 > SHA256SUMS)
      - name: Create or update draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh needs the repository spelled out.
          GH_REPO: ${{ github.repository }}
        run: |
          notes='Unsigned preview generated by CI. Not for normal-user installation: signing, notarization, bundled Android tools, and cross-platform launch validation are still required.'
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/tmp/taprig-release.json 2>/dev/null; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --draft --prerelease --title "TapRig $GITHUB_REF_NAME (unsigned preview)" --notes "$notes"
          fi
