name: Emulator smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 33, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - name: Build the Android driver bundle
        run: npm run build:driver
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot an emulator and drive it through the daemon
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            export TAPRIG_DATA_DIR="$RUNNER_TEMP/taprig"
            export TAPRIG_DRIVER_DIR="$PWD/android-driver/build/bundle"
            node src/cli.ts daemon serve > "$RUNNER_TEMP/daemon.log" 2>&1 &
            for attempt in $(seq 1 60); do
              node src/cli.ts doctor > "$RUNNER_TEMP/doctor.txt" 2>&1 && break
              sleep 2
            done
            cat "$RUNNER_TEMP/doctor.txt"
            grep -q "PASS  emulator-5554" "$RUNNER_TEMP/doctor.txt"
            node src/cli.ts execute emulator-5554 launch com.android.settings
            sleep 3
            adb shell dumpsys window | grep -q "com.android.settings" || (cat "$RUNNER_TEMP/daemon.log"; exit 1)
            node src/cli.ts execute emulator-5554 key home
            node src/cli.ts notifications emulator-5554
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: daemon-log-api-${{ matrix.api-level }}
          path: ${{ runner.temp }}/daemon.log
